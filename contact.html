<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Deepika Jha Portfolio</title>

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f3;
        }

        /* Navigation */
        nav {
            background: #1a1a1a;
            padding: 15px 0;
        }
        nav ul {
            display: flex;
            justify-content: center;
            gap: 40px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #ff9800;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        /* Contact Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input, textarea {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 100%;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            padding: 15px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff9800;
        }

        /* Footer */
        footer {
            background: #1a1a1a;
            color: white;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            padding: 30px;
            margin-top: 40px;
        }
        footer div {
            margin-bottom: 20px;
            max-width: 250px;
        }
        footer h3 {
            margin-bottom: 10px;
            color: #ff9800;
        }

        /* Social footer icons */
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .social-icons a {
            background: #ffffff22;
            padding: 12px;
            border-radius: 50%;
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease-in-out;
            color: white;
        }
        .social-icons a:hover {
            background: #ff9800;
            transform: scale(1.2);
        }

        /* Responsive */
        @media (max-width: 600px) {
            nav ul { flex-direction: column; gap: 15px; }
            footer { flex-direction: column; align-items: center; }
            footer div { text-align: center; }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->

    <div class="container" id="contact">

        <form action="mailto:deepikajha018@gmail.com" method="post" enctype="text/plain">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="text" name="subject" placeholder="Subject" required>
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Footer -->

</body>
